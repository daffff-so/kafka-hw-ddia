x-kafka-common: &kafka-common
  image: apache/kafka:4.4.0
  restart: unless-stopped
  environment: &kafka-environment
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 8s
    retries: 20
    start_period: 30s

x-app-common: &app-common
  build: .
  image: kafka-hw-app:local
  restart: unless-stopped
  environment: &app-environment
    KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    DATABASE_URL: postgresql://kafka:kafka@postgres:5432/kafka_hw
    PYTHONUNBUFFERED: 1

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  topic-init:
    image: apache/kafka:4.4.0
    restart: "no"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 \
          --create --if-not-exists --topic events --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 \
          --create --if-not-exists --topic events.dlt --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --describe --topic events
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --describe --topic events.dlt

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka
      POSTGRES_DB: kafka_hw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafka -d kafka_hw"]
      interval: 5s
      timeout: 5s
      retries: 20

  producer-1:
    <<: *app-common
    command: python -m app.producer
    depends_on: &app-dependencies
      topic-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment:
      <<: *app-environment
      INSTANCE_ID: producer-1
      PRODUCER_NUMBER: 1
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
      POISON_RATE: ${POISON_RATE:-0.02}
      KEY_MODE: ${KEY_MODE:-user_id}
    volumes:
      - producer-1-state:/state

  producer-2:
    <<: *app-common
    command: python -m app.producer
    depends_on: *app-dependencies
    environment:
      <<: *app-environment
      INSTANCE_ID: producer-2
      PRODUCER_NUMBER: 2
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
      POISON_RATE: ${POISON_RATE:-0.02}
      KEY_MODE: ${KEY_MODE:-user_id}
    volumes:
      - producer-2-state:/state

  producer-3:
    <<: *app-common
    command: python -m app.producer
    depends_on: *app-dependencies
    environment:
      <<: *app-environment
      INSTANCE_ID: producer-3
      PRODUCER_NUMBER: 3
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-5}
      POISON_RATE: ${POISON_RATE:-0.02}
      KEY_MODE: ${KEY_MODE:-user_id}
    volumes:
      - producer-3-state:/state

  consumer-1:
    <<: *app-common
    command: python -m app.consumer
    depends_on: *app-dependencies
    environment: &consumer-environment
      <<: *app-environment
      INSTANCE_ID: consumer-1
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-200}
      COMMIT_DELAY_MS: ${COMMIT_DELAY_MS:-100}
      AUTO_OFFSET_RESET: earliest

  consumer-2:
    <<: *app-common
    command: python -m app.consumer
    depends_on: *app-dependencies
    environment:
      <<: *consumer-environment
      INSTANCE_ID: consumer-2

  consumer-3:
    <<: *app-common
    command: python -m app.consumer
    depends_on: *app-dependencies
    environment:
      <<: *consumer-environment
      INSTANCE_ID: consumer-3

  verify:
    <<: *app-common
    profiles: ["tools"]
    restart: "no"
    command: python -m app.verify
    depends_on: *app-dependencies
    environment:
      <<: *app-environment
      GITHUB_LOGIN: ${GITHUB_LOGIN:-GITHUB_LOGIN_NOT_SET}

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  producer-1-state:
  producer-2-state:
  producer-3-state:

